name: Bug report
description: Report a bug in SimplyDial to help us resolve it
labels: [ "bug", "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Hi there 👋
        Thanks for helping us improve **SimplyDial** by reporting a bug!
        Please fill in as much information as possible to help us quickly reproduce and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I can reproduce the bug with the latest release version."
          required: true
        - label: "I made sure that there are **no existing open issues** covering this bug."
          required: true
        - label: "**I have provided all relevant details to reproduce the issue.**"
          required: true
        - label: "This report focuses on a single bug."
          required: true
        - label: "I have read and understood the [contribution guidelines](CONTRIBUTING.md)."
          required: true

  - type: input
    id: app-version
    attributes:
      label: SimplyDial Version
      description: "Which app version were you using when the bug occurred?"
      placeholder: "e.g. 1.7.0 - Found in Settings -> About SimplyDial"
    validations:
      required: true

  - type: input
    id: device-os-info
    attributes:
      label: Device & Android Version
      description: "What device and Android OS version are you running?"
      placeholder: "e.g. Google Pixel 7, Android 14 / Samsung Galaxy S23, One UI 6"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Open SimplyDial dialpad
        2. Dial a phone number
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What you expected to happen instead."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or Logs (Optional)
      description: "Add screenshots, screen recordings, or logcat output if applicable."
