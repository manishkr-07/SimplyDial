name: Feature request
description: Suggest an idea or enhancement for SimplyDial
labels: [ "feature request", "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Hi there 👋
        Thanks for helping make **SimplyDial** better!
        Share your ideas for new features, accessibility enhancements (EaseUI), or design improvements.

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I made sure that there are **no existing open issues** for this feature."
          required: true
        - label: "This request focuses on a single feature concept."
          required: true
        - label: "I have read and understood the [contribution guidelines](CONTRIBUTING.md)."
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: "Explain what feature or capability you would like to see in SimplyDial."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why is this needed?
      description: "Describe the use-case or problem this feature solves (e.g. accessibility, senior care, productivity)."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution or Mockups (Optional)
      description: "Any ideas on how this should look or work?"
