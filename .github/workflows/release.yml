name: Build & Publish Release Assets

on:
  release:
    types: [published, created, edited]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to attach to drafted/latest release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore (Optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No custom keystore secret found. Will sign with Android debug key for installation."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Core Release & Debug APKs
        run: |
          ./gradlew assembleCoreRelease assembleCoreDebug --stacktrace

      - name: Prepare Release Assets & Sign if Needed
        id: prepare_assets
        run: |
          mkdir -p release-assets

          # Extract release tag or version from event or gradle.properties
          TAG="${{ github.event.release.tag_name || inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$(grep -m 1 'VERSION_NAME' gradle.properties | cut -d'=' -f2 | tr -d ' ')"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Find Release and Debug APKs
          RELEASE_APK=$(find app/build/outputs/apk/core/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/core/debug -name "*.apk" | head -n 1)

          echo "Found Release APK: $RELEASE_APK"
          echo "Found Debug APK: $DEBUG_APK"

          FINAL_RELEASE_APK="release-assets/SimplyDial-${TAG}-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            if [[ "$RELEASE_APK" == *"-unsigned.apk" ]] || [ "${{ steps.keystore.outputs.has_keystore }}" != "true" ]; then
              echo "Signing release APK with debug key for direct phone installation..."
              BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
              $BUILD_TOOLS_DIR/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out "$FINAL_RELEASE_APK" "$RELEASE_APK" || cp "$RELEASE_APK" "$FINAL_RELEASE_APK"
            else
              cp "$RELEASE_APK" "$FINAL_RELEASE_APK"
            fi
          fi

          if [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-assets/SimplyDial-${TAG}-debug.apk"
          fi

          # Create ZIP archive containing APKs
          cd release-assets
          zip -9 "SimplyDial-${TAG}.zip" *.apk

          # Create TAR.GZ archive containing APKs
          tar -czvf "SimplyDial-${TAG}.tar.gz" *.apk

          # Generate SHA-256 Checksums
          sha256sum *.apk *.zip *.tar.gz > "SHA256SUMS.txt"
          cd ..

          echo "=== Prepared Release Assets ==="
          ls -lah release-assets/

      - name: Attach Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          fail_on_unmatched_files: false
          files: |
            release-assets/*.apk
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
